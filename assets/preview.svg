<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- App Shell -->
  <rect width="1200" height="680" fill="url(#bg3)" rx="12"/>
  <rect width="1198" height="678" x="1" y="1" fill="none" stroke="#1E293B" stroke-width="2" rx="11"/>

  <!-- Window Header -->
  <rect width="1200" height="48" fill="#1E293B" rx="12" ry="12"/>
  <rect width="1200" height="12" y="36" fill="#1E293B"/>
  <circle cx="24" cy="24" r="6" fill="#EF4444"/>
  <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="24" r="6" fill="#10B981"/>

  <!-- Centered View Mode Switcher -->
  <rect x="470" y="10" width="260" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
  <rect x="556" y="12" width="94" height="24" rx="4" fill="#1E293B"/>
  <text x="484" y="28" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">Design</text>
  <text x="568" y="28" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">Split Diff</text>
  <text x="664" y="28" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="600">Web View</text>

  <!-- LEFT PANEL: Operations & Layer Tree -->
  <rect x="16" y="60" width="220" height="430" fill="#090D16" rx="8" stroke="#1E293B"/>
  <rect x="16" y="60" width="220" height="34" fill="#131D31" rx="8" ry="8"/>
  <text x="28" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">OPERATIONS</text>

  <text x="28" y="116" fill="#10B981" font-family="monospace" font-size="11">[x] CanvasOp</text>
  <text x="28" y="142" fill="#10B981" font-family="monospace" font-size="11">[x] AssetMappingOp</text>
  <text x="28" y="168" fill="#10B981" font-family="monospace" font-size="11">[x] ContainerIsoOp</text>
  <text x="28" y="194" fill="#10B981" font-family="monospace" font-size="11">[x] TextEdgeOp</text>
  <text x="28" y="220" fill="#64748B" font-family="monospace" font-size="11">[ ] OcrTextMatch</text>

  <rect x="16" y="240" width="220" height="34" fill="#131D31"/>
  <text x="28" y="262" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">LAYERS</text>
  <text x="28" y="296" fill="#64748B" font-family="monospace" font-size="11"># body</text>
  <rect x="22" y="308" width="206" height="24" rx="4" fill="#1E293B"/>
  <text x="36" y="324" fill="#38BDF8" font-family="monospace" font-size="11">v container:1</text>
  <text x="50" y="348" fill="#94A3B8" font-family="monospace" font-size="11"># image:banner</text>
  <text x="50" y="372" fill="#94A3B8" font-family="monospace" font-size="11">T badge:learning</text>
  <text x="50" y="396" fill="#94A3B8" font-family="monospace" font-size="11">T heading:title</text>
  <text x="50" y="420" fill="#94A3B8" font-family="monospace" font-size="11">= author_row</text>

  <!-- CENTER: Infinite Workspace Canvas with Split Slider -->
  <rect x="248" y="60" width="674" height="430" fill="#050811" rx="8" stroke="#1E293B"/>
  
  <!-- Outer Canvas Inside Workspace -->
  <rect x="360" y="80" width="450" height="390" fill="#F4D04E" rx="8"/>

  <!-- Underneath Card (Source Image half) -->
  <rect x="470" y="110" width="230" height="330" fill="#FFFFFF" rx="16" stroke="#111111" stroke-width="2"/>
  <rect x="485" y="125" width="200" height="110" fill="#111111" rx="8"/>
  <rect x="485" y="250" width="60" height="20" fill="#F4D04E" rx="4"/>
  <rect x="485" y="280" width="160" height="18" fill="#111111" rx="3"/>

  <!-- Right Half of Card (Rendered HTML/CSS with Shadow) -->
  <rect x="585" y="118" width="123" height="330" fill="#111111" rx="16"/>
  <rect x="585" y="110" width="115" height="330" fill="#FFFFFF" rx="0" stroke="#111111" stroke-width="2"/>
  <rect x="585" y="125" width="100" height="110" fill="#111111" rx="0"/>
  <rect x="585" y="280" width="80" height="18" fill="#111111" rx="0"/>

  <!-- Center Split Line / Onion-Skin Scrubber Handle -->
  <line x1="585" y1="70" x2="585" y2="480" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="585" cy="260" r="14" fill="#38BDF8"/>
  <path d="M 581 260 L 589 254 L 589 266 Z" fill="#0F172A"/>
  <path d="M 589 260 L 581 254 L 581 266 Z" fill="#0F172A"/>
  
  <!-- Badges indicating modes on canvas -->
  <rect x="450" y="88" width="90" height="20" rx="4" fill="#0F172A" opacity="0.8"/>
  <text x="460" y="102" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="700">ORIGINAL</text>
  <rect x="620" y="88" width="90" height="20" rx="4" fill="#0F172A" opacity="0.8"/>
  <text x="630" y="102" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700">RENDERED</text>

  <!-- RIGHT PANEL: Visual Inspector & Actions -->
  <rect x="934" y="60" width="250" height="430" fill="#090D16" rx="8" stroke="#1E293B"/>
  <rect x="934" y="60" width="250" height="34" fill="#131D31" rx="8" ry="8"/>
  <text x="946" y="82" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">ACTIONS &amp; STYLES</text>

  <text x="946" y="116" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">TARGET: <tspan fill="#38BDF8">container:1</tspan></text>
  
  <!-- One-Click Operations -->
  <rect x="946" y="130" width="226" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="956" y="147" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">+ Auto Border (1px solid)</text>

  <rect x="946" y="162" width="226" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="956" y="179" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">+ Auto Shadow (8px 8px)</text>

  <rect x="946" y="194" width="226" height="26" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="956" y="211" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="600">+ Extract Padding (24px)</text>

  <!-- Live Dimensions -->
  <text x="946" y="246" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="700">GEOMETRY</text>
  <rect x="946" y="256" width="108" height="42" fill="#0F172A" rx="4" stroke="#1E293B"/>
  <text x="956" y="272" fill="#64748B" font-family="sans-serif" font-size="10">WIDTH</text>
  <text x="956" y="290" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">384px</text>

  <rect x="1064" y="256" width="108" height="42" fill="#0F172A" rx="4" stroke="#1E293B"/>
  <text x="1074" y="272" fill="#64748B" font-family="sans-serif" font-size="10">HEIGHT</text>
  <text x="1074" y="290" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700">478px</text>

  <!-- BOTTOM PANEL: Collapsible Unified Code Console -->
  <rect x="16" y="502" width="1168" height="166" fill="#050811" rx="8" stroke="#1E293B"/>
  <rect x="16" y="502" width="1168" height="28" fill="#0F172A" rx="8" ry="8"/>
  <text x="28" y="520" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">CODE DECK</text>
  <rect x="110" y="506" width="60" height="20" rx="3" fill="#1E293B"/>
  <text x="122" y="520" fill="#38BDF8" font-family="monospace" font-size="10">HTML</text>
  <rect x="176" y="506" width="60" height="20" rx="3" fill="#090D16"/>
  <text x="190" y="520" fill="#94A3B8" font-family="monospace" font-size="10">CSS</text>

  <!-- HTML Stream -->
  <text x="28" y="552" fill="#38BDF8" font-family="monospace" font-size="11">&lt;main <tspan fill="#F8FAFC">class="card"&gt;</tspan></text>
  <text x="46" y="572" fill="#38BDF8" font-family="monospace" font-size="11">&lt;img <tspan fill="#F8FAFC">class="card-banner" src="images/illustration-article.svg" /&gt;</tspan></text>
  <text x="46" y="592" fill="#38BDF8" font-family="monospace" font-size="11">&lt;span <tspan fill="#F8FAFC">class="badge"&gt;Learning&lt;/span&gt;</tspan></text>
  <text x="46" y="612" fill="#38BDF8" font-family="monospace" font-size="11">&lt;h1 <tspan fill="#F8FAFC">class="title"&gt;HTML &amp; CSS foundations&lt;/h1&gt;</tspan></text>
  <text x="28" y="632" fill="#38BDF8" font-family="monospace" font-size="11">&lt;/main&gt;</text>

  <!-- CSS Stream (Right Column of code deck) -->
  <line x1="580" y1="530" x2="580" y2="660" stroke="#1E293B"/>
  <text x="600" y="552" fill="#C084FC" font-family="monospace" font-size="11">.card {</text>
  <text x="618" y="572" fill="#94A3B8" font-family="monospace" font-size="11">border: <tspan fill="#F8FAFC">1px solid #111111;</tspan></text>
  <text x="618" y="592" fill="#38BDF8" font-family="monospace" font-size="11">box-shadow: 8px 8px 0px #111111;</text>
  <text x="618" y="612" fill="#94A3B8" font-family="monospace" font-size="11">border-radius: <tspan fill="#F8FAFC">20px;</tspan> padding: <tspan fill="#F8FAFC">24px;</tspan></text>
  <text x="600" y="632" fill="#C084FC" font-family="monospace" font-size="11">}</text>
</svg>
