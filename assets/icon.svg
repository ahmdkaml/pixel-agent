<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Navy High-Contrast Base -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- High-Luminance Electric Cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00D8F6"/>
    </linearGradient>

    <!-- Ultra-Vibrant Magenta / Violet -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="30%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Pure Light Center Laser -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle with Luminous Border -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="8"/>

  <!-- High-Visibility Viewfinder Reticles (Thickened 2.5x) -->
  <g stroke="#00E5FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 88 152 L 88 116 Q 88 88 116 88 L 152 88" />
    <!-- Top-Right -->
    <path d="M 360 88 L 396 88 Q 424 88 424 116 L 424 152" />
    <!-- Bottom-Left -->
    <path d="M 88 360 L 88 396 Q 88 424 116 424 L 152 424" />
    <!-- Bottom-Right -->
    <path d="M 360 424 L 396 424 Q 424 424 424 396 L 424 360" />
  </g>

  <!-- Corner Anchor Nodes -->
  <rect x="80" y="80" width="16" height="16" rx="4" fill="#E0F2FE"/>
  <rect x="416" y="80" width="16" height="16" rx="4" fill="#E0F2FE"/>
  <rect x="80" y="416" width="16" height="16" rx="4" fill="#E0F2FE"/>
  <rect x="416" y="416" width="16" height="16" rx="4" fill="#E0F2FE"/>

  <!-- Left: Bold Pixel Opening Bracket '<' -->
  <g fill="url(#cyanGrad)">
    <!-- Apex Block -->
    <rect x="124" y="238" width="36" height="36" rx="8"/>
    <!-- Upper Steps -->
    <rect x="166" y="196" width="36" height="36" rx="8"/>
    <rect x="208" y="154" width="36" height="36" rx="8"/>
    <!-- Lower Steps -->
    <rect x="166" y="280" width="36" height="36" rx="8"/>
    <rect x="208" y="322" width="36" height="36" rx="8"/>
  </g>

  <!-- Center: Bright White Laser Slash '/' -->
  <line x1="282" y1="138" x2="230" y2="374" 
        stroke="url(#laserGrad)" 
        stroke-width="26" 
        stroke-linecap="round"/>

  <!-- Right: Thick Vector Closing Bracket '>' -->
  <path d="M 302 160 L 392 256 L 302 352" 
        stroke="url(#violetGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>

  <!-- White Core Accent Points (Maximizes Tiny-Scale Legibility) -->
  <circle cx="142" cy="256" r="6" fill="#FFFFFF"/>
  <circle cx="376" cy="256" r="6" fill="#FFFFFF"/>
</svg>
